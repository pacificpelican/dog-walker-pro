<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" shape-rendering="crispEdges">
  <rect width="64" height="64" rx="10" fill="#6b2fa0"/>
  <rect x="2" y="2" width="60" height="60" rx="8" fill="none" stroke="#ff8a1f" stroke-width="2"/>
  <!-- ears -->
  <rect x="6" y="14" width="12" height="26" fill="#8a6a45"/>
  <rect x="8" y="16" width="4" height="12" fill="#a8885f"/>
  <rect x="6" y="36" width="6" height="4" fill="#7dff3a"/>
  <rect x="46" y="14" width="12" height="26" fill="#8a6a45"/>
  <rect x="52" y="16" width="4" height="12" fill="#a8885f"/>
  <rect x="52" y="36" width="6" height="4" fill="#ff5fa8"/>
  <!-- curly head fluff -->
  <rect x="16" y="8" width="32" height="8" fill="#b89a6c"/>
  <rect x="20" y="5" width="8" height="5" fill="#c9ab7c"/><rect x="30" y="4" width="8" height="6" fill="#c9ab7c"/><rect x="40" y="6" width="6" height="5" fill="#c9ab7c"/>
  <rect x="22" y="6" width="3" height="3" fill="#7dff3a"/><rect x="42" y="7" width="3" height="3" fill="#ff8aa8"/>
  <!-- face -->
  <rect x="14" y="14" width="36" height="34" fill="#b89a6c"/>
  <rect x="16" y="12" width="32" height="4" fill="#b89a6c"/>
  <rect x="22" y="36" width="20" height="16" fill="#e8d4b0"/>
  <!-- eyes, wide open -->
  <rect x="18" y="20" width="9" height="9" fill="#fff"/><rect x="37" y="20" width="9" height="9" fill="#fff"/>
  <rect x="21" y="22" width="5" height="6" fill="#1b1030"/><rect x="40" y="22" width="5" height="6" fill="#1b1030"/>
  <rect x="22" y="23" width="2" height="2" fill="#fff"/><rect x="41" y="23" width="2" height="2" fill="#fff"/>
  <rect x="18" y="16" width="9" height="2" fill="#7a5a30"/><rect x="37" y="16" width="9" height="2" fill="#7a5a30"/>
  <!-- nose -->
  <rect x="27" y="34" width="10" height="6" fill="#1b1030"/><rect x="29" y="35" width="3" height="1" fill="#ff8a1f"/>
  <!-- open smiling mouth -->
  <rect x="24" y="43" width="16" height="8" fill="#1b1030"/>
  <rect x="26" y="43" width="12" height="2" fill="#fff"/>
  <rect x="27" y="48" width="10" height="5" fill="#ff5f8f"/><rect x="28" y="49" width="4" height="2" fill="#ff9fc0"/>
  <!-- sparkle accents -->
  <rect x="9" y="6" width="2" height="6" fill="#ffd24a"/><rect x="7" y="8" width="6" height="2" fill="#ffd24a"/>
  <rect x="52" y="50" width="2" height="6" fill="#ffd24a"/><rect x="50" y="52" width="6" height="2" fill="#ffd24a"/>
</svg>
